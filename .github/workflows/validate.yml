name: validate

on:
  pull_request:
    paths:
      - "deploy/**"
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "dockworker.toml"
      - ".github/workflows/validate.yml"
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  # GAR (GKE-only fleet; AKS/EKS + ECR retired). Matches the registry used by
  # lornu-ai/dockworker.ai rust-backend and brains.
  GAR_LOCATION: us-central1
  GAR_REGISTRY: us-central1-docker.pkg.dev
  GAR_REPOSITORY: gcp-lornu-ai/lornu-ai/oxidizedgraph-server

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  kustomize:
    name: kustomize build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tgz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /usr/local/bin

      - name: Install kubeconform
        run: |
          curl -sLo /tmp/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform

      - name: kustomize build (base)
        run: kustomize build deploy/base > /tmp/base.yaml

      - name: kustomize build (gke-autopilot overlay)
        run: kustomize build deploy/overlays/gke-autopilot > /tmp/overlay.yaml

      - name: kustomize build (eks overlay)
        run: kustomize build deploy/overlays/eks > /tmp/eks.yaml

      - name: kustomize build (gke-hub overlay)
        run: kustomize build deploy/overlays/gke-hub > /tmp/gke-hub.yaml

      - name: Assert EKS overlay uses ECR image and amd64 scheduling
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="oxidizedgraph") | .version')
          if [[ -z "$VERSION" ]]; then
            echo "::error::Failed to parse package version from cargo metadata"
            exit 1
          fi
          grep -q "148080843892.dkr.ecr.us-east-2.amazonaws.com/stevedores-org/oxidizedgraph/server:${VERSION}" /tmp/eks.yaml
          grep -q 'kubernetes.io/arch: amd64' /tmp/eks.yaml

      - name: Assert NetworkPolicy and PDB use oxidizedgraph namespace
        run: |
          python3 <<'PY'
          import re, sys
          text = open("/tmp/overlay.yaml").read()
          for kind in ("NetworkPolicy", "PodDisruptionBudget"):
              found = False
              for m in re.finditer(
                  rf"kind: {kind}\nmetadata:\n(?:  [^\n]+\n)*?  namespace: (\S+)",
                  text,
              ):
                  found = True
                  if m.group(1) != "oxidizedgraph":
                      print(f"{kind} has namespace {m.group(1)!r}, want oxidizedgraph")
                      sys.exit(1)
              if not found:
                  print(f"no {kind} in overlay render")
                  sys.exit(1)
          print("ok: NetworkPolicy and PodDisruptionBudget in namespace oxidizedgraph")
          PY

      - name: kubeconform — base
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/base.yaml

      - name: kubeconform — overlay
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/overlay.yaml

      - name: kubeconform — eks overlay
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/eks.yaml

      - name: kubeconform — gke-hub overlay
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/gke-hub.yaml

      - name: kubeconform — worker job template
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 deploy/base/worker-job-template.yaml

  nix:
    name: nix build .#server-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nix-cache.stevedores.org
            extra-trusted-public-keys = nix-cache.stevedores.org-1:Y2WLZtQTgxQ2QQzUnRDkDDKX08dL3NoNZ+Ohw3jv+7I=
      - name: build server-image
        run: nix build .#server-image -L --no-link

  publish-gar-preflight:
    name: publish-gar preflight
    # Runs unconditionally on push-to-main so a missing repo variable is a
    # loud CI failure, not a silent skip of `publish-gar`. The actual
    # publish job's `if:` gate stays in place to short-circuit feature PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify GCP_WIF_PROVIDER and GCP_WIF_SERVICE_ACCOUNT are set
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          WIF_SA: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$WIF_PROVIDER" || -z "$WIF_SA" ]]; then
            echo "::error::GCP_WIF_PROVIDER / GCP_WIF_SERVICE_ACCOUNT repo variables are empty. publish-gar will be silently skipped. Configure them (and grant the SA Artifact Registry Writer on ${GAR_REPOSITORY%%/*}) to enable publishing — see docs/DEPLOY_GKE.md."
            exit 1
          fi
          echo "✓ GCP WIF variables set; publish-gar will run."

  publish-gar:
    name: publish linux/amd64 image to GAR
    needs: [nix, publish-gar-preflight]
    # Use vars (not secrets) — secrets can't be referenced in job-level `if`.
    # The preflight job above turns a missing variable into a visible failure;
    # this gate still short-circuits non-main pushes and PR runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        # SHA-pinned per security policy — floating @v2 lets a compromised
        # release of this action mint GCP credentials on our behalf. Bump
        # via Dependabot; comment carries the human-readable version.
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nix-cache.stevedores.org
            extra-trusted-public-keys = nix-cache.stevedores.org-1:Y2WLZtQTgxQ2QQzUnRDkDDKX08dL3NoNZ+Ohw3jv+7I=

      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      # NOTE: the GAR repository (gcp-lornu-ai/lornu-ai) is provisioned out of
      # band (infra-code), unlike the old `aws ecr create-repository` step —
      # skopeo can't create GAR repos. The push fails loudly if it's missing.

      - name: Build OCI image (linux/amd64)
        run: nix build .#server-image -o result -L

      - name: Push to GAR
        run: |
          mkdir -p ~/.config/containers
          printf '%s\n' '{"default":[{"type":"insecureAcceptAnything"}]}' > ~/.config/containers/policy.json
          # Parse the published-package version from cargo metadata so we're
          # immune to: workspace.package.version moves, `# version = ...`
          # comment lines, and dep entries that sort before the [package]
          # block via `head -1`. `jq` ships on ubuntu-latest.
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="oxidizedgraph") | .version')
          if [[ -z "$VERSION" ]]; then
            echo "::error::Failed to parse package version from cargo metadata"
            exit 1
          fi
          IMAGE="${GAR_REGISTRY}/${GAR_REPOSITORY}"
          TAG_SHA="${VERSION}-${GITHUB_SHA::7}"
          skopeo login "$GAR_REGISTRY" --username oauth2accesstoken \
            --password "${{ steps.auth.outputs.access_token }}"
          skopeo copy docker-archive:./result "docker://${IMAGE}:${VERSION}"
          skopeo copy docker-archive:./result "docker://${IMAGE}:${TAG_SHA}"
          skopeo copy docker-archive:./result "docker://${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${VERSION}, ${IMAGE}:${TAG_SHA}, ${IMAGE}:latest"
