name: docs-publish

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GAR_LOCATION: us-central1
  GAR_REGISTRY: us-central1-docker.pkg.dev
  GAR_REPOSITORY: gcp-lornu-ai/lornu-ai/oxidizedgraph-docs

jobs:
  validate:
    name: build docs + kustomize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun build (commercial root host)
        working-directory: docs-site
        run: |
          bun install --frozen-lockfile
          VITE_DOCS_BASE=/ bun run build

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tgz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /usr/local/bin

      - name: kustomize build docs overlay
        run: kustomize build deploy/docs/overlays/gke-prod

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true

      - name: nix build docs-image (requires dist/)
        run: nix build .#docs-image -o result --no-link


