apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxidizedgraph-server
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oxidizedgraph-server
  template:
    metadata:
      labels:
        app: oxidizedgraph-server
    spec:
      containers:
      - name: server
        image: stevedores-org/oxidizedgraph-server:latest
        ports:
        - containerPort: 8080
        env:
        - name: RUST_LOG
          value: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: oxidizedgraph-server
  namespace: agents
spec:
  selector:
    app: oxidizedgraph-server
  ports:
  - port: 80
    targetPort: 8080
