# OCI packaging: nix builds image tarballs -> skopeo pushes to registry.
# See docs/PACKAGING.md and docs/DEPLOY_GKE.md

version = 1
flake = ".#"

# Tag strategy: keep default/tag in sync with Cargo.toml package.version.
# CI/release: export IMAGE_TAG="$(git rev-parse --short HEAD)" before push.
[tags]
default = "0.2.0" # sync with Cargo.toml on release

[[images]]
name = "oxidizedgraph/server"
nix_output = "server-image"
push = true
tag = "0.2.0"

[registry]
default = "ghcr.io/stevedores-org"

[transport]
tool = "skopeo"
