[package]
name = "oxidizedgraph"
version = "0.2.0"
edition = "2021"
authors = ["Lornuai, Inc."]
description = "Private commercial LangGraph-in-Rust orchestration — multi-tenant RBAC, audit, SLO guardrails (Lornu AI enterprise edition)"
license-file = "LICENSE"
repository = "https://github.com/lornu-ai/oxidizedgraph"
publish = false
keywords = [
  "langgraph",
  "ai-agents",
  "agent-orchestration",
  "rust",
  "tokio",
  "workflow",
  "graph",
  "enterprise",
  "multi-tenant",
  "rbac",
  "audit",
  "petgraph",
]
categories = ["asynchronous", "development-tools"]

[features]
default = []
persistence = ["surrealdb"]
stream = ["tokio-stream/sync"]
k8s = ["kube", "k8s-openapi"]

[dependencies]
petgraph = { version = "0.6", features = ["serde-1"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
derive_builder = "0.20"
crossbeam-channel = "0.5"
git2 = "0.19"
axum = "0.7"

# Kubernetes worker spawning (issue #41) - optional, enabled in-cluster
kube = { version = "0.98", features = ["runtime", "derive"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_30"], optional = true }

# Persistence layer (optional)
surrealdb = { version = "2", optional = true, features = ["kv-mem"] }
pathdiff = "0.2.3"
clap = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
criterion = "0.5"
tempfile = "3.27.0"

[[example]]
name = "simple_workflow"
path = "examples/simple_workflow.rs"

[[example]]
name = "react_agent"
path = "examples/react_agent.rs"

[[example]]
name = "git_push"
path = "examples/git_push.rs"

[[example]]
name = "rag_workflow"
path = "examples/rag_workflow.rs"

[[example]]
name = "streaming_events"
path = "examples/streaming_events.rs"

[[example]]
name = "multi_agent"
path = "examples/multi_agent.rs"

[[example]]
name = "autonomous_dev_workflow"
path = "examples/autonomous_dev_workflow.rs"

[[example]]
name = "role_orchestration_workflow"
path = "examples/role_orchestration_workflow.rs"

[[example]]
name = "planning_workflow"
path = "examples/planning_workflow.rs"

[[example]]
name = "hitl_workflow"
path = "examples/hitl_workflow.rs"

[[example]]
name = "memory_workflow"
path = "examples/memory_workflow.rs"

[[example]]
name = "multirepo_cicd_workflow"
path = "examples/multirepo_cicd_workflow.rs"

[[example]]
name = "enterprise_workflow"
path = "examples/enterprise_workflow.rs"

[[example]]
name = "governance_workflow"
path = "examples/governance_workflow.rs"
[[bin]]
name = "oxidizedgraph-server"
path = "src/bin/server.rs"

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "runtime"
harness = false
