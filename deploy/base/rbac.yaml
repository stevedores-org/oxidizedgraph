apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oxidizedgraph-job-spawner
  labels:
    app.kubernetes.io/name: oxidizedgraph
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oxidizedgraph-job-spawner
  labels:
    app.kubernetes.io/name: oxidizedgraph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oxidizedgraph-job-spawner
subjects:
  - kind: ServiceAccount
    name: oxidizedgraph
    namespace: oxidizedgraph
