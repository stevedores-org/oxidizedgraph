apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxidizedgraph
  namespace: oxidizedgraph
  labels:
    app.kubernetes.io/name: oxidizedgraph
    stevedores.org/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oxidizedgraph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oxidizedgraph
    spec:
      serviceAccountName: oxidizedgraph
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: oxidizedgraph
          image: ghcr.io/stevedores-org/oxidizedgraph/server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oxidizedgraph
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
