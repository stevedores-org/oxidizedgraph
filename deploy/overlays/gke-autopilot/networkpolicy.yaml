# Default-deny ingress for the namespace; allow only oxidizedgraph HTTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oxidizedgraph-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oxidizedgraph
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# Default-deny egress; oxidizedgraph may reach cluster DNS and HTTPS (LLM/tool calls).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oxidizedgraph-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oxidizedgraph
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
