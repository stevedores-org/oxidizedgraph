apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Required so overlay-only resources (NetworkPolicy, PDB) land in oxidizedgraph, not default.
namespace: oxidizedgraph

resources:
  - ../../base
  - networkpolicy.yaml
  - poddisruptionbudget.yaml

# Pin by semver in-repo; override with digest at deploy time (see docs/DEPLOY_GKE.md).
images:
  - name: ghcr.io/stevedores-org/oxidizedgraph/server
    newTag: "0.2.0"

patches:
  - path: deployment-autopilot.yaml
  - path: serviceaccount-wi.yaml
