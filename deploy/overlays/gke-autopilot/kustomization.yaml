apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# GKE Autopilot: explicit resources, Workload Identity on ServiceAccount.
patches:
  - target:
      kind: Deployment
      name: oxidizedgraph
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
