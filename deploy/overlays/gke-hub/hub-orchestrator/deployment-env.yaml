apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxidizedgraph
spec:
  template:
    spec:
      containers:
        - name: oxidizedgraph
          env:
            - name: WORKER_SPAWNER
              value: k8s
            - name: WORKER_NAMESPACE
              value: workers
            - name: WORKER_SERVICE_ACCOUNT
              value: adk-agent-worker
