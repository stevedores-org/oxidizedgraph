apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oxidizedgraph-job-manager
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oxidizedgraph-job-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oxidizedgraph-job-manager
subjects:
  - kind: ServiceAccount
    name: oxidizedgraph
    namespace: hub
