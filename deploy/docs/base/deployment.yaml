apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxidizedgraph-docs
  namespace: oxidizedgraph-docs
  labels:
    app: oxidizedgraph-docs
    lornu.ai/app: oxidizedgraph
    lornu.ai/component: docs
    lornu.ai/edition: commercial
    lornu.ai/managed-by: flux
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: oxidizedgraph-docs
  template:
    metadata:
      labels:
        app: oxidizedgraph-docs
        lornu.ai/app: oxidizedgraph
        lornu.ai/component: docs
    spec:
      containers:
        - name: docs
          image: us-central1-docker.pkg.dev/gcp-lornu-ai/lornu-ai/oxidizedgraph-docs:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
